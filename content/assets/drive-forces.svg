<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 320' width='680' height='320' role='img' aria-label='Forces a mobile robot drive must overcome on a slope'><title>Forces a mobile robot drive must overcome on a slope</title><rect width='680' height='320' rx='12' fill='#ffffff'/><polygon points='40.0,290.0 640.0,290.0 640.0,184.2' fill='#eef2f5' stroke='#18212b' stroke-width='2'/><circle cx='317.5' cy='222.8' r='18' fill='#ffffff' stroke='#18212b' stroke-width='3'/><circle cx='406.2' cy='207.2' r='18' fill='#ffffff' stroke='#18212b' stroke-width='3'/><polygon points='284.9,210.3 432.6,184.2 422.2,125.1 274.5,151.2' fill='#dbe6ee' stroke='#18212b' stroke-width='2'/><line x1='353.5' y1='167.7' x2='353.5' y2='218.7' stroke='#5a6774' stroke-width='3' stroke-linecap='round'/><polygon points='353.5,229.7 359.0,218.7 348.0,218.7' fill='#5a6774' stroke='none' stroke-width='0'/><text x='361.5' y='227.7' font-family='JetBrains Mono, monospace' font-size='12' font-weight='600' fill='#5a6774' text-anchor='start'>mg</text><line x1='452.0' y1='150.3' x2='528.8' y2='136.8' stroke='#2e8b57' stroke-width='3.5' stroke-linecap='round'/><polygon points='540.6,134.7 527.8,130.9 529.9,142.7' fill='#2e8b57' stroke='none' stroke-width='0'/><text x='501.2' y='115.7' font-family='JetBrains Mono, monospace' font-size='12' font-weight='600' fill='#2e8b57' text-anchor='middle'>traction F</text><line x1='260.0' y1='184.2' x2='182.2' y2='197.9' stroke='#d9822b' stroke-width='3' stroke-linecap='round'/><polygon points='171.3,199.8 183.1,203.3 181.2,192.5' fill='#d9822b' stroke='none' stroke-width='0'/><text x='165.4' y='204.9' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#d9822b' text-anchor='end'>F_s = mg sinθ</text><line x1='268.0' y1='229.5' x2='190.2' y2='243.2' stroke='#6a4fb3' stroke-width='3' stroke-linecap='round'/><polygon points='179.3,245.1 191.1,248.6 189.2,237.8' fill='#6a4fb3' stroke='none' stroke-width='0'/><text x='173.4' y='250.2' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#6a4fb3' text-anchor='end'>F_rr = C_rr·mg</text><text x='40.0' y='70.0' font-family='JetBrains Mono, monospace' font-size='12' font-weight='600' fill='#2e8b57' text-anchor='start'>F = F_a + F_rr + F_s,  where F_a = ma</text><text x='340.0' y='30.0' font-family='JetBrains Mono, monospace' font-size='12' font-weight='600' fill='#18212b' text-anchor='middle'>Motor torque must supply: accelerate (ma) + rolling resistance + climb</text><text x='580.0' y='276.0' font-family='JetBrains Mono, monospace' font-size='13' font-weight='600' fill='#5a6774' text-anchor='middle'>θ</text></svg>