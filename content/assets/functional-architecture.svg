<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 780 420' width='780' height='420' role='img' aria-label='Functional architecture of a campus delivery robot, with flows of signal, data, energy and material'><title>Functional architecture of a campus delivery robot, with flows of signal, data, energy and material</title><rect width='780' height='420' rx='12' fill='#ffffff'/><rect x='40.0' y='70.0' width='150.0' height='52.0' rx='8' fill='#eef2f5' stroke='#18212b' stroke-width='2'/><text x='115.0' y='92.5' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#18212b' text-anchor='middle'>Sense</text><text x='115.0' y='107.5' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#18212b' text-anchor='middle'>surroundings</text><rect x='300.0' y='70.0' width='150.0' height='52.0' rx='8' fill='#eef2f5' stroke='#18212b' stroke-width='2'/><text x='375.0' y='92.5' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#18212b' text-anchor='middle'>Localise and</text><text x='375.0' y='107.5' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#18212b' text-anchor='middle'>plan route</text><rect x='560.0' y='70.0' width='170.0' height='52.0' rx='8' fill='#eef2f5' stroke='#18212b' stroke-width='2'/><text x='645.0' y='92.5' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#18212b' text-anchor='middle'>Drive and</text><text x='645.0' y='107.5' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#18212b' text-anchor='middle'>steer</text><rect x='40.0' y='200.0' width='150.0' height='52.0' rx='8' fill='#eef2f5' stroke='#18212b' stroke-width='2'/><text x='115.0' y='222.5' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#18212b' text-anchor='middle'>Take requests,</text><text x='115.0' y='237.5' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#18212b' text-anchor='middle'>report status</text><rect x='560.0' y='200.0' width='170.0' height='52.0' rx='8' fill='#eef2f5' stroke='#18212b' stroke-width='2'/><text x='645.0' y='222.5' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#18212b' text-anchor='middle'>Store and</text><text x='645.0' y='237.5' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#18212b' text-anchor='middle'>manage power</text><rect x='300.0' y='320.0' width='150.0' height='52.0' rx='8' fill='#eef2f5' stroke='#18212b' stroke-width='2'/><text x='375.0' y='342.5' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#18212b' text-anchor='middle'>Carry and secure</text><text x='375.0' y='357.5' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#18212b' text-anchor='middle'>the payload</text><rect x='300.0' y='200.0' width='150.0' height='52.0' rx='8' fill='#fbe9e7' stroke='#c0392b' stroke-width='2'/><text x='375.0' y='222.5' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#18212b' text-anchor='middle'>Safety monitor</text><text x='375.0' y='237.5' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#18212b' text-anchor='middle'>(can always stop)</text><line x1='190.0' y1='96.0' x2='290.0' y2='96.0' stroke='#1f6f8b' stroke-width='2.5' stroke-linecap='round'/><polygon points='300.0,96.0 290.0,91.0 290.0,101.0' fill='#1f6f8b' stroke='none' stroke-width='0'/><text x='245.0' y='62.0' font-family='JetBrains Mono, monospace' font-size='10' font-weight='400' fill='#1f6f8b' text-anchor='middle'>position, obstacles</text><line x1='450.0' y1='96.0' x2='550.0' y2='96.0' stroke='#6a4fb3' stroke-width='2.5' stroke-linecap='round'/><polygon points='560.0,96.0 550.0,91.0 550.0,101.0' fill='#6a4fb3' stroke='none' stroke-width='0'/><text x='505.0' y='62.0' font-family='JetBrains Mono, monospace' font-size='10' font-weight='400' fill='#6a4fb3' text-anchor='middle'>speed commands</text><line x1='190.0' y1='226.0' x2='290.0' y2='226.0' stroke='#1f6f8b' stroke-width='2.5' stroke-linecap='round'/><polygon points='300.0,226.0 290.0,221.0 290.0,231.0' fill='#1f6f8b' stroke='none' stroke-width='0'/><line x1='190.0' y1='226.0' x2='290.0' y2='226.0' stroke='#1f6f8b' stroke-width='2.5' stroke-linecap='round'/><polygon points='300.0,226.0 290.0,221.0 290.0,231.0' fill='#1f6f8b' stroke='none' stroke-width='0'/><line x1='150.0' y1='200.0' x2='320.8' y2='126.0' stroke='#6a4fb3' stroke-width='2.5' stroke-linecap='round'/><polygon points='330.0,122.0 318.8,121.4 322.8,130.6' fill='#6a4fb3' stroke='none' stroke-width='0'/><text x='205.0' y='170.0' font-family='JetBrains Mono, monospace' font-size='10' font-weight='400' fill='#6a4fb3' text-anchor='middle'>destination</text><line x1='645.0' y1='200.0' x2='645.0' y2='132.0' stroke='#d9822b' stroke-width='2.5' stroke-linecap='round'/><polygon points='645.0,122.0 640.0,132.0 650.0,132.0' fill='#d9822b' stroke='none' stroke-width='0'/><text x='652.0' y='166.0' font-family='JetBrains Mono, monospace' font-size='10' font-weight='400' fill='#d9822b' text-anchor='start'>electrical power</text><line x1='450.0' y1='226.0' x2='553.3' y2='112.4' stroke='#c0392b' stroke-width='2.5' stroke-linecap='round'/><polygon points='560.0,105.0 549.6,109.0 557.0,115.8' fill='#c0392b' stroke='none' stroke-width='0'/><text x='520.0' y='175.0' font-family='JetBrains Mono, monospace' font-size='10' font-weight='600' fill='#c0392b' text-anchor='middle'>stop</text><line x1='645.0' y1='122.0' x2='456.8' y2='322.7' stroke='#2e8b57' stroke-width='2.5' stroke-linecap='round'/><polygon points='450.0,330.0 460.5,326.1 453.2,319.3' fill='#2e8b57' stroke='none' stroke-width='0'/><text x='560.0' y='290.0' font-family='JetBrains Mono, monospace' font-size='10' font-weight='400' fill='#2e8b57' text-anchor='middle'>motion</text><text x='375.0' y='398.0' font-family='JetBrains Mono, monospace' font-size='10' font-weight='400' fill='#2e8b57' text-anchor='middle'>payload in → payload delivered</text><text x='20.0' y='40.0' font-family='JetBrains Mono, monospace' font-size='12' font-weight='600' fill='#18212b' text-anchor='start'>Functions are verbs; arrows are flows:</text><line x1='330.0' y1='36.0' x2='352.0' y2='36.0' stroke='#1f6f8b' stroke-width='3' stroke-linecap='round'/><text x='358.0' y='40.0' font-family='JetBrains Mono, monospace' font-size='11' font-weight='400' fill='#1f6f8b' text-anchor='start'>signal</text><line x1='440.0' y1='36.0' x2='462.0' y2='36.0' stroke='#6a4fb3' stroke-width='3' stroke-linecap='round'/><text x='468.0' y='40.0' font-family='JetBrains Mono, monospace' font-size='11' font-weight='400' fill='#6a4fb3' text-anchor='start'>data</text><line x1='550.0' y1='36.0' x2='572.0' y2='36.0' stroke='#d9822b' stroke-width='3' stroke-linecap='round'/><text x='578.0' y='40.0' font-family='JetBrains Mono, monospace' font-size='11' font-weight='400' fill='#d9822b' text-anchor='start'>energy</text><line x1='660.0' y1='36.0' x2='682.0' y2='36.0' stroke='#2e8b57' stroke-width='3' stroke-linecap='round'/><text x='688.0' y='40.0' font-family='JetBrains Mono, monospace' font-size='11' font-weight='400' fill='#2e8b57' text-anchor='start'>material</text></svg>