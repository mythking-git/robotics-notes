<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 340' width='900' height='340' role='img' aria-label='The iceberg model: events, patterns, structures and mental models'><title>The iceberg model: events, patterns, structures and mental models</title><rect width='900' height='340' rx='12' fill='#ffffff'/><line x1='20.0' y1='92.0' x2='880.0' y2='92.0' stroke='#1f6f8b' stroke-width='2' stroke-linecap='round' stroke-dasharray='8 6'/><text x='24.0' y='84.0' font-family='JetBrains Mono, monospace' font-size='10' font-weight='400' fill='#1f6f8b' text-anchor='start'>waterline</text><polygon points='200.0,40.0 280.0,40.0 320.0,92.0 160.0,92.0' fill='#ffffff' stroke='#18212b' stroke-width='2'/><text x='240.0' y='71.0' font-family='JetBrains Mono, monospace' font-size='12' font-weight='600' fill='#18212b' text-anchor='middle'>Events</text><text x='470.0' y='71.0' font-family='JetBrains Mono, monospace' font-size='11' font-weight='400' fill='#18212b' text-anchor='start'>what happened: the robot was late today</text><polygon points='160.0,92.0 320.0,92.0 360.0,152.0 120.0,152.0' fill='#e4eef3' stroke='#18212b' stroke-width='2'/><text x='240.0' y='127.0' font-family='JetBrains Mono, monospace' font-size='12' font-weight='600' fill='#18212b' text-anchor='middle'>Patterns</text><text x='470.0' y='127.0' font-family='JetBrains Mono, monospace' font-size='11' font-weight='400' fill='#5a6774' text-anchor='start'>what keeps happening: late every lunchtime</text><polygon points='120.0,152.0 360.0,152.0 400.0,222.0 80.0,222.0' fill='#c9dde7' stroke='#18212b' stroke-width='2'/><text x='240.0' y='192.0' font-family='JetBrains Mono, monospace' font-size='12' font-weight='600' fill='#18212b' text-anchor='middle'>Structures</text><text x='470.0' y='192.0' font-family='JetBrains Mono, monospace' font-size='11' font-weight='400' fill='#5a6774' text-anchor='start'>what causes it: one lift, fixed timetables</text><polygon points='80.0,222.0 400.0,222.0 440.0,300.0 40.0,300.0' fill='#a9c7d6' stroke='#18212b' stroke-width='2'/><text x='240.0' y='266.0' font-family='JetBrains Mono, monospace' font-size='12' font-weight='600' fill='#18212b' text-anchor='middle'>Mental models</text><text x='470.0' y='266.0' font-family='JetBrains Mono, monospace' font-size='11' font-weight='400' fill='#5a6774' text-anchor='start'>beliefs that hold it in place: "robots should go at peak"</text><text x='470.0' y='326.0' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#6a4fb3' text-anchor='start'>deeper level = harder to change, longer-lasting fix</text></svg>