<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 360' width='660' height='360' role='img' aria-label='Moment of a force about O, with the perpendicular distance and the force components'><title>Moment of a force about O, with the perpendicular distance and the force components</title><rect width='660' height='360' rx='12' fill='#ffffff'/><polyline points='200.0,200.0 350.0,200.0 500.0,150.0' fill='none' stroke='#18212b' stroke-width='8' stroke-linejoin='round' stroke-linecap='round'/><circle cx='200.0' cy='200.0' r='9' fill='#ffffff' stroke='#18212b' stroke-width='3'/><text x='182.0' y='228.0' font-family='JetBrains Mono, monospace' font-size='13' font-weight='600' fill='#18212b' text-anchor='middle'>O</text><line x1='247.2' y1='362.1' x2='645.5' y2='27.9' stroke='#c3ccd5' stroke-width='1.5' stroke-linecap='round' stroke-dasharray='6 5'/><line x1='500.0' y1='150.0' x2='588.9' y2='75.4' stroke='#d9822b' stroke-width='3.5' stroke-linecap='round'/><polygon points='599.6,66.4 584.4,70.1 593.4,80.8' fill='#d9822b' stroke='none' stroke-width='0'/><text x='587.6' y='54.4' font-family='JetBrains Mono, monospace' font-size='13' font-weight='600' fill='#d9822b' text-anchor='end'>F = 80 N</text><line x1='500.0' y1='150.0' x2='589.6' y2='150.0' stroke='#1f6f8b' stroke-width='2.5' stroke-linecap='round'/><polygon points='599.6,150.0 589.6,145.0 589.6,155.0' fill='#1f6f8b' stroke='none' stroke-width='0'/><text x='607.6' y='166.0' font-family='JetBrains Mono, monospace' font-size='12' font-weight='600' fill='#1f6f8b' text-anchor='start'>F_x</text><line x1='500.0' y1='150.0' x2='500.0' y2='76.4' stroke='#1f6f8b' stroke-width='2.5' stroke-linecap='round'/><polygon points='500.0,66.4 495.0,76.4 505.0,76.4' fill='#1f6f8b' stroke='none' stroke-width='0'/><text x='492.0' y='70.4' font-family='JetBrains Mono, monospace' font-size='12' font-weight='600' fill='#1f6f8b' text-anchor='end'>F_y</text><circle cx='500.0' cy='150.0' r='5' fill='#18212b' stroke='#18212b' stroke-width='1'/><text x='508.0' y='170.0' font-family='JetBrains Mono, monospace' font-size='13' font-weight='600' fill='#18212b' text-anchor='start'>A</text><line x1='200.0' y1='200.0' x2='299.3' y2='318.4' stroke='#6a4fb3' stroke-width='2' stroke-linecap='round' stroke-dasharray='4 4'/><text x='237.7' y='263.2' font-family='JetBrains Mono, monospace' font-size='13' font-weight='600' fill='#6a4fb3' text-anchor='end'>d</text><line x1='200.0' y1='245.0' x2='500.0' y2='245.0' stroke='#5a6774' stroke-width='1.2' stroke-linecap='round'/><text x='350.0' y='262.0' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#5a6774' text-anchor='middle'>x = 0.30 m</text><line x1='522.0' y1='200.0' x2='522.0' y2='150.0' stroke='#5a6774' stroke-width='1.2' stroke-linecap='round'/><text x='528.0' y='179.0' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#5a6774' text-anchor='start'>y = 0.05 m</text><text x='40.0' y='320.0' font-family='JetBrains Mono, monospace' font-size='13' font-weight='600' fill='#18212b' text-anchor='start'>M_O = F·d = F_y·x − F_x·y</text><text x='40.0' y='342.0' font-family='JetBrains Mono, monospace' font-size='11' font-weight='600' fill='#5a6774' text-anchor='start'>anticlockwise +</text></svg>